apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-daily-lab
  labels:
    app.kubernetes.io/name: spring-daily-lab
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-daily-lab
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-daily-lab
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/jungyeons/spring-daily-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: spring-daily-lab
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: spring-daily-lab-database
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spring-daily-lab-database
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-daily-lab-database
                  key: password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
