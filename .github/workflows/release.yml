name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify semantic version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3; received $TAG_NAME" >&2
            exit 1
          fi

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --verify-tag --generate-notes --title "$TAG_NAME"
