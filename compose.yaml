services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daily_lab
      POSTGRES_USER: daily_lab
      POSTGRES_PASSWORD: daily_lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_lab -d daily_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - daily-lab-data:/var/lib/postgresql/data

  app:
    build: .
    stop_grace_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/daily_lab
      DB_USERNAME: daily_lab
      DB_PASSWORD: daily_lab
      H2_CONSOLE_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  daily-lab-data:
